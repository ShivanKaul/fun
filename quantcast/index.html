<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple Quantcast tracker blocking test using the same pixel and scoring as PrivacyTests.org.">
  <title>Quantcast blocking test</title>
  <link rel="icon" href="data:,">
  <style>
    :root { font-family: system-ui, sans-serif; color: #1c2934; background: #f5f6f8; color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 20px; }
    main { max-width: 560px; margin: 5vh auto; }
    h1 { margin: 0 0 12px; font-size: clamp(1.7rem, 6vw, 2.2rem); letter-spacing: -0.04em; }
    p { line-height: 1.6; }
    .intro { color: #536170; margin-bottom: 28px; }
    .result { padding: 28px; border: 1px solid #cbd3dc; border-radius: 16px; background: white; }
    .result[data-state="pass"] { background: #edf8f1; border-color: #85bd98; }
    .result[data-state="fail"] { background: #fff1f0; border-color: #d99a92; }
    .result[data-state="unknown"] { background: #fff8e7; border-color: #d2b15d; }
    h2 { margin: 0; font-size: 2rem; letter-spacing: -0.025em; }
    [data-state="pass"] h2 { color: #14633a; }
    [data-state="fail"] h2 { color: #a52b25; }
    [data-state="unknown"] h2 { color: #735100; }
    #message { margin-bottom: 0; }
    button { width: 100%; margin-top: 18px; min-height: 48px; padding: 12px 20px; border: 0; border-radius: 9px; background: #243b53; color: white; font: inherit; font-weight: 650; cursor: pointer; }
    button:hover { background: #142c44; }
    button:disabled { cursor: wait; opacity: .65; }
    button:focus-visible { outline: 3px solid #366fbc; outline-offset: 4px; }
    .note { font-size: .9rem; color: #536170; margin-top: 22px; }
    .probe { position: absolute; width: 1px; height: 1px; left: -10px; }
    @media (max-width: 480px) { body { padding-top: 24px; } main { margin-top: 2vh; } .result { padding: 22px; } }
  </style>
</head>
<body>
  <main>
    <h1>Quantcast blocking test</h1>
    <p class="intro">Open this page in the browser you want to test. The test runs automatically.</p>
    <section class="result" id="result" data-state="ready" aria-live="polite" aria-atomic="true" aria-busy="false">
      <h2 id="status">Ready</h2>
      <p id="message">Checking whether the Quantcast tracking pixel loads.</p>
    </section>
    <button id="run" type="button">Run test</button>
    <noscript><p>JavaScript is required to run this test.</p></noscript>
    <p class="note">Uses PrivacyTests.org's image-load scoring.</p>
  </main>
  <script>
    const result = document.getElementById('result');
    const status = document.getElementById('status');
    const message = document.getElementById('message');
    const button = document.getElementById('run');

    function show(state, title, text) {
      result.dataset.state = state;
      status.textContent = title;
      message.textContent = text;
    }

    function probe(url) {
      return new Promise((resolve) => {
        const image = document.createElement('img');
        image.alt = '';
        image.className = 'probe';
        let settled = false;
        const finish = (outcome) => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          image.onload = null;
          image.onerror = null;
          image.removeAttribute('src');
          image.remove();
          resolve(outcome);
        };
        const timer = setTimeout(() => finish('timeout'), 15000);
        image.onload = () => finish('loaded');
        image.onerror = () => finish('error');
        document.body.appendChild(image);
        image.src = url;
      });
    }

    async function run() {
      if (button.disabled) return;
      button.disabled = true;
      button.textContent = 'Testing…';
      result.setAttribute('aria-busy', 'true');
      try {
        const url = new URL('https://pixel.quantserve.com/pixel');
        url.searchParams.set('sessionId', `${Date.now()}-${Math.random().toString(36).slice(2)}`);
        for (let attempt = 1; attempt <= 3; attempt++) {
          if (navigator.onLine === false) {
            show('unknown', 'INCONCLUSIVE', 'Your browser reports that it is offline. Reconnect and try again.');
            return;
          }
          show('ready', 'Testing…', `Loading the Quantcast pixel. Attempt ${attempt} of 3.`);
          const outcome = await probe(url.href);
          if (outcome === 'loaded') {
            show('fail', 'FAIL', 'The Quantcast tracking pixel loaded.');
            return;
          }
          if (navigator.onLine === false) {
            show('unknown', 'INCONCLUSIVE', 'Your browser reports that it is offline. Reconnect and try again.');
            return;
          }
          if (outcome === 'error') {
            show('pass', 'PASS', 'The Quantcast tracking pixel did not load.');
            return;
          }
          if (attempt < 3) await new Promise((resolve) => setTimeout(resolve, 500));
        }
        show('unknown', 'INCONCLUSIVE', 'The pixel timed out three times. Try again on a working connection.');
      } catch {
        show('unknown', 'INCONCLUSIVE', 'The test could not run. Reload this page and try again.');
      } finally {
        button.disabled = false;
        button.textContent = 'Run again';
        result.setAttribute('aria-busy', 'false');
      }
    }

    button.addEventListener('click', run);
    run();
  </script>
</body>
</html>
